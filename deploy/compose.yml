# Pile de production de Yumi sur le Droplet, à côté de n8n (voir deploy/README.md).
# Sur le serveur : /opt/yumi/compose.yml, lancée avec `docker compose up -d`.
#
# - L'API rejoint le réseau `proxy`, partagé avec le Caddy de n8n qui termine le HTTPS.
# - PostgreSQL et Redis restent sur un réseau interne, sans accès extérieur.
# - Mémoire plafonnée par service : le Droplet est partagé avec n8n.
name: yumi

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  api:
    image: yumi-api:${YUMI_VERSION:?YUMI_VERSION manquant dans .env}
    restart: unless-stopped
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://yumi:${POSTGRES_PASSWORD}@postgres:5432/yumi
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: yumi
    # Réglages adaptés à un plafond de 256 Mo.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 256m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yumi']
      interval: 10s
      retries: 10
    networks:
      - internal
    logging: *logging

  # Limitation de débit uniquement : aucune donnée à conserver.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save '' --appendonly no --maxmemory 48mb --maxmemory-policy volatile-ttl
    mem_limit: 64m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 10
    networks:
      - internal
    logging: *logging

networks:
  internal:
    internal: true
  proxy:
    external: true

volumes:
  postgres-data:
