# Services locaux de développement. Lancer avec : pnpm db:up
name: yumi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yumi
      POSTGRES_PASSWORD: yumi
      POSTGRES_DB: yumi
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crée la base de test (yumi_test) au premier démarrage.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yumi']
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Capture tous les courriels envoyés en dev : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
